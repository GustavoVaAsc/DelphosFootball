services:
  db:
    image: postgres:16
    container_name: delphos-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delphos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
    ports:
      - "${DELPHOS_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-delphos}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - delphos-network

  migrate:
    image: python:3.13-slim
    container_name: delphos-migrate
    working_dir: /app
    environment:
      DELPHOS_DB_HOST: db
      DELPHOS_DB_PORT: 5432
      DELPHOS_DB_NAME: ${POSTGRES_DB:-delphos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      DELPHOS_DB_USER: ${DELPHOS_DB_USER:-delphos_ml_publisher}
      DELPHOS_DB_PASSWORD: ${DELPHOS_DB_PASSWORD:-delphos_ml_publisher_secret}
      DELPHOS_APP_DB_USER: ${DELPHOS_APP_DB_USER:-delphos_app_user}
      DELPHOS_APP_DB_PASSWORD: ${DELPHOS_APP_DB_PASSWORD:-delphos_app_user_secret}
    volumes:
      - ./migrations:/app/migrations:ro
    command: >
      sh -c "pip install --no-cache-dir 'alembic>=1.14.0' 'psycopg[binary]>=3.2.0' &&
             alembic -c /app/migrations/alembic.ini upgrade heads"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delphos-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: delphos-backend
    environment:
      DELPHOS_DB_HOST: db
      DELPHOS_DB_PORT: 5432
      DELPHOS_DB_NAME: ${POSTGRES_DB:-delphos}
      DELPHOS_APP_DB_USER: ${DELPHOS_APP_DB_USER:-delphos_app_user}
      DELPHOS_APP_DB_PASSWORD: ${DELPHOS_APP_DB_PASSWORD:-delphos_app_user_secret}
      DELPHOS_API_PORT: ${DELPHOS_API_PORT:-8000}
      DELPHOS_CORS_ORIGINS: ${DELPHOS_CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000}
      DELPHOS_LLM_API_URL: ${DELPHOS_LLM_API_URL:-http://inference-chat:8080/v1}
      # Must equal the model id the inference server serves (LLAMA_ARG_ALIAS
      # below); a mismatch makes every LLM request fail to resolve the model.
      DELPHOS_LLM_MODEL_NAME: ${DELPHOS_LLM_MODEL_NAME:-qwen/qwen3.5-9b}
    ports:
      - "${DELPHOS_API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health/live\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - delphos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delphos-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - delphos-network

  inference-chat:
    # The image tag selects the CUDA or the CPU build of the same server, so the
    # same compose file serves both. Overridable through LLAMA_ARG_IMAGE.
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_ARG_IMAGE:-server-cuda}
    container_name: delphos-inference-chat
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: 8080
      # The model file inside the mounted directory. Overridable so the same
      # compose file serves the CUDA and the CPU variant of the model.
      LLAMA_ARG_MODEL: ${LLAMA_ARG_MODEL:-/models/Qwen3.5-9B-Q5_K_M.gguf}
      # The id llama.cpp reports for the loaded model. It MUST equal the
      # DELPHOS_LLM_MODEL_NAME the backend sends in the request body, because
      # the request is routed by that id.
      # Verify after the stack starts:
      #   curl http://inference-chat:8080/v1/models
      # and confirm the returned "id" equals the id the backend sends.
      LLAMA_ARG_ALIAS: ${DELPHOS_LLM_MODEL_NAME:-qwen/qwen3.5-9b}
      LLAMA_ARG_CTX_SIZE: 32768
      LLAMA_ARG_N_PARALLEL: 4
      LLAMA_ARG_KV_UNIFIED: "on"
      LLAMA_ARG_N_GPU_LAYERS: 99
      LLAMA_ARG_FLASH_ATTN: on
      LLAMA_ARG_JINJA: on
      LLAMA_ARG_REASONING: auto
      LLAMA_ARG_CACHE_TYPE_K: q8_0
      LLAMA_ARG_CACHE_TYPE_V: q8_0
    volumes:
      - ./llms/models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - delphos-network

  pipeline:
    profiles:
      - pipeline
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    container_name: delphos-pipeline
    working_dir: /app/ml
    environment:
      DELPHOS_DB_HOST: db
      DELPHOS_DB_PORT: 5432
      DELPHOS_DB_NAME: ${POSTGRES_DB:-delphos}
      DELPHOS_DB_USER: ${DELPHOS_DB_USER:-delphos_ml_publisher}
      DELPHOS_DB_PASSWORD: ${DELPHOS_DB_PASSWORD:-delphos_ml_publisher_secret}
      DELPHOS_DATA_DIR: /app/ml/data
    volumes:
      - .:/app:rw
      - ./artifacts:/app/artifacts:rw
      - ./ml/data:/app/ml/data:rw
    command: ["uv", "run", "delphos-pipeline", "publish"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - delphos-network

volumes:
  pgdata:
    name: delphos_pgdata

networks:
  delphos-network:
    name: delphos_network

