# Virtual workspace root: it is not a package and has no [project] table.
# `uv sync` installs every workspace member plus the dependency groups below
# into one environment (.venv) locked by a single uv.lock.
[tool.uv.workspace]
members = ["ml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["ml/src", "ml/tests"]
# Python only: ruff 0.17 also formats Markdown by default, and the docs are hand-written.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
