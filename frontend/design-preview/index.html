    function ensureTableShell(container) {
      if (!document.getElementById("players-tbody")) container.innerHTML = tableShellHtml();
      return document.getElementById("players-tbody");
    }

    function renderExplorerFrame() {
      const split = document.getElementById("master-detail-split");
      const panel = document.getElementById("explorer-state-panel");
      const isError = dataStatus === "error";
      if (split) split.classList.toggle("is-error", isError);
      if (panel) {
        panel.hidden = !isError;
        panel.innerHTML = isError ? statePanelHtml("error") : "";
      }
    }

    function renderPlayersTable() {
      const container = document.getElementById("players-table-container");
      const countLabel = document.getElementById("table-count-label");
      container.setAttribute("aria-busy", String(dataStatus === "loading"));

      if (dataStatus === "error") {
        countLabel.textContent = "";
        return;
      }

      if (dataStatus === "loading") {
        countLabel.textContent = "Cargando jugadores…";
        ensureTableShell(container).innerHTML = skeletonRowsHtml(8);
        return;
      }

      const filtered = getFilteredPlayers();
      countLabel.textContent = `${formatNumber(filtered.length)} de ${formatNumber(TOTAL_PLAYERS)} jugadores`;

      // A dossier never shows a player the table no longer lists (including
      // the empty result); the selection itself is kept for the comparator.
      if (state.dossierOpen && !filtered.some(p => p.player_id === state.selectedPlayerId)) {
        state.dossierOpen = false;
        announceDossier();
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card" role="status">
            <div class="section-title">Ningún jugador cumple estos filtros</div>
            <p>Filtros activos: ${describeActiveFilters()}.</p>
            <button type="button" class="btn-executive-secondary" onclick="resetAllFilters()">Restablecer filtros</button>
          </div>
        `;
        return;
      }

      // Rebuilding the rows destroys the focused name button; put focus back
      // on the same player's button so keyboard users keep their place.
      const focused = document.activeElement;
      const focusedId = focused && focused.classList && focused.classList.contains("row-open-btn")
        ? Number(focused.dataset.playerId) : null;

      ensureTableShell(container).innerHTML = filtered.map(p => {
        const isOpen = state.dossierOpen && p.player_id === state.selectedPlayerId;
        const v = p.valuation;
        const posEs = POS_LABELS[p.position] || p.position;
        const subPosEs = SUBPOS_LABELS[p.sub_position] || posEs;
        const age = playerAgeYears(p);

        return `
          <tr class="player-row ${isOpen ? 'selected' : ''}" onclick="handlePlayerRowClick(event, ${p.player_id})">
            <td>
              <div class="player-identity-cell">
                <div class="avatar-wrap-44">
                  <img class="player-avatar-44" src="${p.image_url}" width="44" height="44" alt="Foto de ${p.name}">
                  <img class="club-crest-badge" src="${p.club_logo_url}" width="20" height="20" alt="Escudo de ${p.club_name}">
                </div>
                <div class="player-name-block">
                  <div class="player-name-text"><button type="button" class="row-open-btn" data-player-id="${p.player_id}" aria-expanded="${isOpen}" aria-controls="dossier-panel" onclick="togglePlayerDossier(${p.player_id})">${p.name}</button></div>
                  <div class="player-sub-line">
                    ${getFlagImgHtml(p.country_of_citizenship)}
                    <span>${p.club_name}</span>
                  </div>
                  <div class="player-arch-line">${CLUSTER_SHORT_LABELS[p.cluster_id]}</div>
                </div>
              </div>
            </td>
            <td class="num">${age === null ? "N/D" : formatNumber(age)}</td>
            <td>
              <div class="pos-zone-cell">
                ${getMiniPitchSvg(p.position, p.sub_position)}
                <span class="pos-main" title="${posEs}">${subPosEs}</span>
              </div>
            </td>
            <td class="num"><span class="money">${formatEur(v.market_value_eur)}</span></td>
            <td class="num"><span class="money ${statusToneClass(v.valuation_status)}">${formatEur(v.fair_value_eur)}</span></td>
            <td class="num">
              <div class="gap-cell">
                <span class="status-pill status-${v.valuation_status}">${VALUATION_LABELS[v.valuation_status]}</span>
                <span class="gap-ratio" title="Valor estimado entre precio de mercado">${formatMultiple(v.fair_value_eur / v.market_value_eur)}</span>
              </div>
            </td>
          </tr>
        `;
      }).join("");

      if (focusedId !== null) focusRowButton(focusedId);
    }

    function rowButtonFor(playerId) {
      return document.querySelector(`#players-tbody .row-open-btn[data-player-id="${playerId}"]`);
    }

    // Returns false when the player's row is not rendered (filtered out).
    function focusRowButton(playerId) {
      const button = rowButtonFor(playerId);
      if (!button) return false;
      button.focus({ preventScroll: true });
      return true;
    }

    // ---------------------------------------------------------------------
    // View 1: dossier
    // ---------------------------------------------------------------------
    function seasonSectionHtml(player, s) {
      if (!s) {
        return `
          <section class="dossier-section">
            <div class="section-header-line">
              <h3 class="section-title">Temporada ${currentSeasonLabel()}</h3>
              <span class="section-subtitle">${CLUSTER_SHORT_LABELS[player.cluster_id]}</span>
            </div>
            <p class="state-inline">Sin estadísticas de temporada para este jugador. La ficha muestra su identidad, su valoración y sus reemplazos.</p>
          </section>
        `;
      }
      const metric = (label, value) => `
              <div class="metric-clean-item">
                <span class="metric-clean-label">${label}</span>
                <span class="metric-clean-number">${value}</span>
              </div>`;
      return `
          <section class="dossier-section">
            <div class="section-header-line">
              <h3 class="section-title">Temporada ${formatSeason(s.season)}</h3>
              <span class="section-subtitle">${CLUSTER_SHORT_LABELS[player.cluster_id]} &middot; datos al ${formatDate(s.as_of_date)}</span>
            </div>
            <div class="metrics-4x2-grid">
              ${metric("Minutos", formatMinutes(s.minutes))}
              ${metric("Partidos (titular)", `${formatNumber(s.apps)} (${formatNumber(validStarts(s))})`)}
              ${metric("Goles", formatNumber(s.goals))}
              ${metric("Asistencias", formatNumber(s.assists))}
              ${metric("Victorias", formatShare(s.win_rate))}
              ${metric("Portería imbatida", formatShare(s.clean_sheet_rate))}
              ${metric("Goles recibidos/p", formatNumber(s.goals_conceded_per_match, 2))}
              ${metric("Tarjetas (A/R)", `${formatNumber(s.yellow_cards)} / ${formatNumber(s.red_cards)}`)}
            </div>
          </section>
      `;
    }

    function isDossierVisible() {
      return dataStatus === "ready" && state.dossierOpen;
    }

    // Also owns the layout: one full-width column when closed, the 440px split
    // when open. Loading and error never show a dossier.
    function renderDossierPanel() {
      const panel = document.getElementById("dossier-panel");
      const split = document.getElementById("master-detail-split");
      const visible = isDossierVisible();
      split.classList.toggle("dossier-open", visible);
      panel.hidden = !visible;

      const player = PLAYERS_DATA.find(p => p.player_id === state.selectedPlayerId) || PLAYERS_DATA[0];
      const key = visible ? `ready:${player.player_id}` : "closed";
      if (key === renderedDossierKey) return;
      // Only a player change inside an open dossier animates; opening does not.
      const shouldAnimate = visible && renderedDossierKey !== null && renderedDossierKey.startsWith("ready:");
      renderedDossierKey = key;

      if (!visible) {
        // Dropping the class keeps the entry animation from replaying when the
        // panel is displayed again.
        panel.classList.remove("dossier-animate");
        panel.innerHTML = "";
        return;
      }

      const s = seasonOf(player);
      const v = player.valuation;
      const rep = player.replacements_payload;

      const posEs = POS_LABELS[player.position] || player.position;
      const subPosEs = SUBPOS_LABELS[player.sub_position] || posEs;
      const countryEs = COUNTRY_ES_MAP[player.country_of_citizenship] || player.country_of_citizenship;
      const footEs = FOOT_LABELS[player.foot] || "N/D";
      const leagueName = s ? (LEAGUE_NAMES[s.league_id] || s.league_id) : null;
      const age = playerAgeYears(player);

      const diffEur = v.fair_value_eur - v.market_value_eur;
      const diffRatio = diffEur / v.market_value_eur;

      const replacementsRowsHtml = rep.replacements.map(c => `
          <div class="replacement-white-card">
            <div class="rep-left">
              <div class="avatar-wrap-40">
                <img class="player-avatar-40" src="${c.candidate_image_url}" width="40" height="40" alt="Foto de ${c.candidate_name}">
                <img class="club-crest-badge crest-17" src="${c.candidate_club_logo_url}" width="17" height="17" alt="Escudo de ${c.candidate_club_name}">
              </div>
              <div style="min-width:0;">
                <div class="rep-name-line">
                  <span class="rep-name">${c.candidate_name}</span>
                  ${getFlagImgHtml(c.candidate_country_of_citizenship)}
                </div>
                <div class="rep-sub-line"><span class="rep-club" title="${c.candidate_club_name}">${c.candidate_club_name}</span><span class="rep-similarity">&middot; ${formatPct(c.similarity_score)} de similitud</span></div>
              </div>
            </div>
            <div class="rep-right">
              <div class="rep-price">${formatEur(c.candidate_market_value_eur)}</div>
              <span class="rep-savings">Ahorro ${formatEur(c.cost_savings_eur)} (${formatPct(c.cost_ratio - 1)})</span>
            </div>
          </div>
        `).join("");

      const shortfallText = describeShortfall(rep);
      const shortfallNote = shortfallText ? `
        <p class="coverage-note" role="note">
          <strong>${formatNumber(rep.replacements.length)} de 3 reemplazos.</strong> ${shortfallText}
        </p>
      ` : "";

      panel.innerHTML = `
        <div class="dossier-header">
          <div class="dossier-player-main">
            <div class="portrait-wrap-64">
              <img class="dossier-portrait-64" src="${player.image_url}" width="64" height="64" alt="Foto de ${player.name}">
              <img class="dossier-club-crest-24" src="${player.club_logo_url}" width="24" height="24" alt="Escudo de ${player.club_name}">
            </div>
            <div class="dossier-identity-text">
              <div class="dossier-name-line">
                <h2 class="dossier-name-title">${player.name}</h2>
                ${rep.is_elite_asset ? '<span class="elite-note">Activo élite</span>' : ''}
              </div>
              <div class="dossier-club-line">
                <span class="club-item">${getFlagImgHtml(player.country_of_citizenship)}<span>${countryEs}</span><span aria-hidden="true">&middot;</span></span>
                <span class="club-item"><strong>${player.club_name}</strong>${leagueName ? '<span aria-hidden="true">&middot;</span>' : ""}</span>
                ${leagueName ? `<span class="club-item">${leagueName}</span>` : ""}
              </div>
            </div>
            <button type="button" class="btn-executive-secondary dossier-close-btn" aria-label="Cerrar ficha" onclick="closeDossier()">
              <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <line x1="3" y1="3" x2="11" y2="11"/>
                <line x1="11" y1="3" x2="3" y2="11"/>
              </svg>
            </button>
          </div>

          <dl class="dossier-bio-row">
            <div class="bio-item"><dt>Edad</dt><dd>${age === null ? "N/D" : formatNumber(age)}</dd></div>
            <div class="bio-item"><dt>Altura</dt><dd>${formatHeight(player.height_in_cm)}</dd></div>
            <div class="bio-item"><dt>Pie</dt><dd>${footEs}</dd></div>
            <div class="bio-item"><dt>Posición</dt><dd>${subPosEs}</dd></div>
          </dl>
        </div>

        <div class="dossier-scroll-body" id="dossier-scroll-body">
          <section class="dossier-section" aria-label="Valoración">
            <div class="valuation-card-top">
              <div class="valuation-figures-pair">
                <div class="val-figure-block">
                  <span class="val-figure-label">Precio de mercado</span>
                  <span class="val-figure-number">${formatEur(v.market_value_eur)}</span>
                </div>
                <div class="val-figure-block">
                  <span class="val-figure-label">Valor estimado</span>
                  <span class="val-figure-number ${statusToneClass(v.valuation_status)}">${formatEur(v.fair_value_eur)}</span>
                </div>
              </div>
              <div class="valuation-verdict">
                <span class="status-pill status-${v.valuation_status}">${VALUATION_LABELS[v.valuation_status]}</span>
                <span class="verdict-gap">Diferencia ${formatSignedEur(diffEur)} (${formatSignedPct(diffRatio)})</span>
              </div>
            </div>

            ${buildValuationDumbbellHtml(v)}

            <div class="model-row" role="group" aria-labelledby="classifier-check-label">
              <span class="model-row-label" id="classifier-check-label">Comprobación de los clasificadores</span>
              <span>Random Forest: <strong>${formatShare(v.rf_undervalued_prob)}</strong> de probabilidad de infravaloración</span>
              <span>${describeClassifierCheck(v)}</span>
            </div>
          </section>

          ${seasonSectionHtml(player, s)}

          <section class="dossier-section">
            <div class="section-header-line with-action">
              <div>
                <h3 class="section-title">Reemplazos</h3>
                <div class="section-subtitle">Mismo arquetipo y posición &middot; ahorro &ge; 20%</div>
              </div>
              <button type="button" class="btn-executive-secondary" onclick="switchView('view-2')">Comparar reemplazos</button>
            </div>
            ${shortfallNote}
            ${rep.replacements.length > 0 ? `<div class="replacements-list">${replacementsRowsHtml}</div>` : ""}
          </section>

          <section class="dossier-section">
            <div class="section-header-line">
              <h3 class="section-title">Resumen</h3>
              <span class="section-subtitle">Texto generado a partir de los datos</span>
            </div>
            <div class="scouting-report-box">
              ${buildExecutiveNarrativeHtml(player)}
            </div>
          </section>
        </div>
      `;

      if (shouldAnimate) {
        panel.classList.remove("dossier-animate");
        void panel.offsetWidth;
        panel.classList.add("dossier-animate");
      }
    }

    // ---------------------------------------------------------------------
    // View 2: comparison table (metrics as rows, players as columns)
    // ---------------------------------------------------------------------

    // Delta against the reference, computed from the values as displayed so the
    // arithmetic on screen always adds up. Only output metrics are toned.
    function deltaHtml(diff, text, toned) {
      let tone = "delta-neutral";
      if (toned && diff > 0) tone = "tone-up";
      if (toned && diff < 0) tone = "tone-down";
      return `<span class="delta ${tone}">${text}</span>`;
    }

    function comparePlayerHeadHtml(kicker, p) {
      return `
        <div class="cmp-kicker">${kicker}</div>
        <div class="cmp-player">
          <div class="avatar-wrap-40">
            <img class="player-avatar-40" src="${p.image}" width="40" height="40" alt="Foto de ${p.name}">
            <img class="club-crest-badge crest-17" src="${p.crest}" width="17" height="17" alt="Escudo de ${p.club}">
          </div>
          <div class="cmp-player-text">
            <div class="cmp-name">${p.name} ${getFlagImgHtml(p.country)}</div>
            <div class="cmp-sub">${p.club}</div>
            ${p.league ? `<div class="cmp-sub cmp-league">${p.league}</div>` : ""}
          </div>
        </div>
      `;
    }

    function renderMoneyballExpandedView() {
      const container = document.getElementById("view-2-content");
      if (dataStatus !== "ready") {
        container.innerHTML = statePanelHtml(dataStatus);
        return;
      }

      const player = PLAYERS_DATA.find(p => p.player_id === state.selectedPlayerId) || PLAYERS_DATA[0];
      const s = seasonOf(player);
      const v = player.valuation;
      const rep = player.replacements_payload;
      const candidates = rep.replacements;
      const missingSlots = Math.max(0, 3 - candidates.length);
      const columnCount = 2 + candidates.length + (missingSlots > 0 ? 1 : 0);

      const selectorOptions = PLAYERS_DATA.map(p =>
        `<option value="${p.player_id}" ${p.player_id === player.player_id ? 'selected' : ''}>
          ${p.name} (${p.club_name}) · Mercado ${formatEur(p.valuation.market_value_eur)} · Valor estimado ${formatEur(p.valuation.fair_value_eur)}
        </option>`
      ).join("");

      const refAge = playerAgeYears(player);
      const refStats = s ? {
        league: LEAGUE_NAMES[s.league_id] || s.league_id,
        minutes: roundOrNull(s.minutes),
        goals: roundOrNull(s.goals),
        assists: roundOrNull(s.assists),
        starter: sharePoints(s.starter_ratio),
        win: sharePoints(s.win_rate)
      } : null;
      const noData = '<span class="cell-note">Sin datos de temporada</span>';
      const notApplicable = '<span class="cell-note">No aplica</span>';

      // Each row: label, reference cell, candidate cell builder.
      const rows = [
        { group: "Valoración" },
        {
          label: "Precio de mercado",
          ref: `<span class="cmp-figure">${formatEur(v.market_value_eur)}</span>`,
          // No delta here: the savings row already states the difference.
          cell: c => `<span class="cmp-figure">${formatEur(c.candidate_market_value_eur)}</span>`
        },
        {
          label: "Valor estimado",
          ref: `<span class="cmp-figure ${statusToneClass(v.valuation_status)}">${formatEur(v.fair_value_eur)}</span>`,
          cell: c => `<span class="cmp-figure ${statusToneClass(c.candidate_valuation_status)}">${formatEur(c.candidate_fair_value_eur)}</span>`
        },
        {
          label: "Estado",
          ref: `<span class="status-pill status-${v.valuation_status}">${VALUATION_LABELS[v.valuation_status]}</span>`,
          cell: c => `<span class="status-pill status-${c.candidate_valuation_status}">${VALUATION_LABELS[c.candidate_valuation_status]}</span>`
        },
        {
          label: "Ahorro frente a la referencia",
          ref: `<span class="cell-note">Precio máximo de un reemplazo: ${formatEur(v.market_value_eur * 0.8)}</span>`,
          cell: c => `<span class="cmp-value">${formatEur(c.cost_savings_eur)}</span>`
            + deltaHtml(0, `(${formatPct(c.cost_ratio - 1)})`, false)
        },
        {
          label: "Similitud táctica",
          ref: notApplicable,
          cell: c => `<span class="cmp-value">${formatPct(c.similarity_score)}</span>`
        },
        { group: `Temporada ${currentSeasonLabel()}` },
        {
          label: "Liga",
          ref: refStats ? `<span class="cmp-value">${refStats.league}</span>` : noData,
          cell: c => `<span class="cmp-value">${LEAGUE_NAMES[c.season_snapshot.league_id] || c.season_snapshot.league_id}</span>`
        },
        {
          label: "Edad",
          ref: refAge === null ? noData : `<span class="cmp-value">${formatCount(refAge, "año", "años")}</span>`,
          cell: c => {
            const raw = c.season_snapshot.age;
            const age = isNumeric(raw) ? Math.floor(Number(raw)) : null;
            if (age === null) return '<span class="cmp-value">N/D</span>';
            const delta = refAge === null ? "" : deltaHtml(age - refAge, formatSignedNumber(age - refAge), false);
            return `<span class="cmp-value">${formatCount(age, "año", "años")}</span>${delta}`;
          }
        },
        ...[
          ["Minutos", "minutes", c => roundOrNull(c.minutes), val => (val === null ? "N/D" : formatMinutes(val)), diff => formatSignedNumber(diff) + "'"],
          ["Goles", "goals", c => roundOrNull(c.goals), val => formatNumber(val), diff => formatSignedNumber(diff)],
          ["Asistencias", "assists", c => roundOrNull(c.assists), val => formatNumber(val), diff => formatSignedNumber(diff)],
          ["Titular", "starter", c => sharePoints(c.starter_ratio), formatPoints, diff => `${formatSignedNumber(diff)} pp`],
          ["Victorias", "win", c => sharePoints(c.win_rate), formatPoints, diff => `${formatSignedNumber(diff)} pp`]
        ].map(([label, key, pick, fmt, fmtDiff]) => ({
          label,
          ref: refStats ? `<span class="cmp-value">${fmt(refStats[key])}</span>` : noData,
          cell: c => {
            const val = pick(c.season_snapshot);
            // No delta when either side is missing or out of range (N/D).
            const refVal = refStats ? refStats[key] : null;
            const delta = refVal !== null && val !== null ? deltaHtml(val - refVal, fmtDiff(val - refVal), true) : "";
            return `<span class="cmp-value">${fmt(val)}</span>${delta}`;
          }
        }))
      ];

      const slotCell = `<td class="cmp-slot" colspan="${missingSlots}" aria-hidden="true"></td>`;
      const bodyHtml = rows.map(row => {
        if (row.group) {
          return `<tr class="cmp-group"><th scope="colgroup" colspan="${columnCount}">${row.group}</th></tr>`;
        }
        return `
          <tr>
            <th scope="row" class="cmp-metric">${row.label}</th>
            <td class="cmp-ref">${row.ref}</td>
            ${candidates.map(c => `<td><div class="cmp-cell">${row.cell(c)}</div></td>`).join("")}
            ${missingSlots > 0 ? slotCell : ""}
          </tr>
        `;
      }).join("");

      const refHead = comparePlayerHeadHtml(
        `Referencia${rep.is_elite_asset ? ' <span class="elite-note">&middot; Activo élite</span>' : ''}`,
        {
          name: player.name, image: player.image_url, crest: player.club_logo_url, club: player.club_name,
          country: player.country_of_citizenship, league: s ? (LEAGUE_NAMES[s.league_id] || s.league_id) : ""
        }
      );
      const candidateHeads = candidates.map(c => `
        <th scope="col" class="cmp-cand-head">
          ${comparePlayerHeadHtml(`Reemplazo ${formatNumber(c.rank)}`, {
            name: c.candidate_name, image: c.candidate_image_url, crest: c.candidate_club_logo_url,
            club: c.candidate_club_name, country: c.candidate_country_of_citizenship,
            league: LEAGUE_NAMES[c.season_snapshot.league_id] || c.season_snapshot.league_id
          })}
        </th>
      `).join("");
      const slotHead = missingSlots > 0 ? `
        <th scope="col" class="cmp-slot-head" colspan="${missingSlots}">
          <div class="cmp-kicker">${formatNumber(candidates.length)} de 3 reemplazos</div>
          <p class="cmp-slot-text">${describeShortfall(rep) || "Ningún jugador cumple los criterios de reemplazo."}</p>
        </th>
      ` : "";

      container.innerHTML = `
        <div class="toolbar-card">
          <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
            <label for="moneyball-player-select" class="filter-label">Jugador analizado</label>
            <select id="moneyball-player-select" class="select-clean" onchange="selectPlayer(Number(this.value))">
              ${selectorOptions}
            </select>
          </div>
          <button type="button" class="btn-executive-secondary" onclick="openPlayerInExplorer(${player.player_id})">
            Volver al Explorador de Mercado
          </button>
        </div>

        <div class="compare-card">
          <table class="compare-table" aria-label="Comparación de ${player.name} con sus reemplazos">
            <colgroup>
              <col class="col-metric">
              <col span="${columnCount - 1}">
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="cmp-metric-head"><span class="sr-only">Métrica</span></th>
                <th scope="col" class="cmp-ref-head">${refHead}</th>
                ${candidateHeads}
                ${slotHead}
              </tr>
            </thead>
            <tbody>
              ${bodyHtml}
            </tbody>
          </table>
        </div>
      `;
    }

    // ---------------------------------------------------------------------
    // View 3: archetypes
    // ---------------------------------------------------------------------

    // Archetype pitch banners: zone geometry only; every zone is drawn in ink.
    const CLUSTER_PITCH_LAYOUTS = {
      0: { zone: [148, 12, 82, 68], players: [[195, 46, 5], [172, 24, 4], [172, 68, 4]] },
      1: { zone: [68, 10, 104, 72], players: [[120, 46, 5], [105, 20, 4], [135, 72, 4]] },
      2: { zone: [10, 14, 88, 64], players: [[42, 34, 4.5], [42, 58, 4.5], [76, 46, 4.5]] }
    };

    function getClusterPitchSvgLight(clusterId) {
      const layout = CLUSTER_PITCH_LAYOUTS[clusterId] || CLUSTER_PITCH_LAYOUTS[2];
      const [x, y, w, h] = layout.zone;
      const dots = layout.players
        .map(([cx, cy, r]) => `<circle class="pitch-player" cx="${cx}" cy="${cy}" r="${r}"/>`)
        .join("");
      return `
        <svg width="240" height="92" viewBox="0 0 240 92" aria-hidden="true">
          <rect class="pitch-ground pitch-line" x="4" y="4" width="232" height="84" rx="4" stroke-width="1.2"/>
          <line class="pitch-line" x1="120" y1="4" x2="120" y2="88" stroke-width="1.2"/>
          <circle class="pitch-line" cx="120" cy="46" r="18" stroke-width="1.2"/>
          <rect class="pitch-zone" x="${x}" y="${y}" width="${w}" height="${h}" rx="4" stroke-width="1.3"/>
          ${dots}
        </svg>
      `;
    }

    function archetypeShareHtml() {
      const clusters = CLUSTERS_DATA.clusters;
      const shareOf = c => Math.round((c.player_count / TOTAL_PLAYERS) * 100);
      const ariaParts = clusters.map(c => `${c.short_name}: ${formatNumber(c.player_count)} (${shareOf(c)}%)`).join(", ");
      return `
        <figure class="share-figure">
          <figcaption class="share-caption">Reparto de los ${formatNumber(TOTAL_PLAYERS)} jugadores por arquetipo</figcaption>
          <div class="share-bar" role="img" aria-label="${ariaParts}">
            ${clusters.map((c, i) => `<span class="share-seg share-tone-${i % 3}" style="flex-grow:${c.player_count}"></span>`).join("")}
          </div>
          <div class="share-legend" aria-hidden="true">
            ${clusters.map((c, i) => `
              <div class="share-legend-item" style="flex-grow:${c.player_count}">
                <span class="share-name"><i class="share-swatch share-tone-${i % 3}"></i>${c.short_name}</span>
                <span class="share-count">${formatNumber(c.player_count)} &middot; ${shareOf(c)}%</span>
              </div>
            `).join("")}
          </div>
        </figure>
      `;
    }

    function renderClustersView() {
      const container = document.getElementById("view-3-content");
      if (dataStatus !== "ready") {
        container.innerHTML = statePanelHtml(dataStatus);
        return;
      }

      const cardsHtml = CLUSTERS_DATA.clusters.map(c => {
        const samplePlayers = PLAYERS_DATA.filter(p => p.cluster_id === c.cluster_id).slice(0, 4);
        const samplesHtml = samplePlayers.map(sp => `
          <li>
            <button type="button" class="sample-link" onclick="openPlayerInExplorer(${sp.player_id})">
              <span class="sample-name">${getFlagImgHtml(sp.country_of_citizenship)}<span>${sp.name}</span></span>
              <span class="sample-price">${formatEur(sp.valuation.market_value_eur)}</span>
            </button>
          </li>
        `).join("");

        return `
          <article class="cluster-card">
            <div class="cluster-card-top">
              <span class="cluster-short-name">${c.short_name}</span>
              <span class="cluster-count">${formatCount(c.player_count, "jugador", "jugadores")}</span>
            </div>

            <div class="cluster-head">
              <h2 class="cluster-title">${c.es_name}</h2>
              <p class="cluster-desc">${c.es_desc}</p>
            </div>

            <div class="cluster-pitch-banner">
              ${getClusterPitchSvgLight(c.cluster_id)}
            </div>

            <div class="metrics-4x2-grid cluster-metrics">
              <div class="metric-clean-item">
                <span class="metric-clean-label">Valor promedio</span>
                <span class="metric-clean-number">${formatEur(c.avg_market_value_eur)}</span>
              </div>
              <div class="metric-clean-item">
                <span class="metric-clean-label">Minutos promedio</span>
                <span class="metric-clean-number">${formatMinutes(c.avg_minutes)}</span>
              </div>
              <div class="metric-clean-item">
                <span class="metric-clean-label">Goles promedio</span>
                <span class="metric-clean-number">${formatNumber(c.avg_goals, 1)}</span>
              </div>
              <div class="metric-clean-item">
                <span class="metric-clean-label">Asistencias promedio</span>
                <span class="metric-clean-number">${formatNumber(c.avg_assists, 1)}</span>
              </div>
            </div>

            <div class="cluster-samples">
              <div class="cluster-samples-label">Jugadores representativos</div>
              <ul class="sample-list">
                ${samplesHtml}
              </ul>
            </div>

            <div class="cluster-card-foot">
              <button type="button" class="text-link" onclick="filterByClusterFromView3(${c.cluster_id})">Ver en el explorador</button>
            </div>
          </article>
        `;
      }).join("");

      container.innerHTML = `
        <div class="toolbar-card archetype-intro">
          <div>
            <h2 class="view-intro-title">Temporada ${currentSeasonLabel()}</h2>
            <p class="view-intro-text">
              Clasificación de los ${formatNumber(TOTAL_PLAYERS)} jugadores de campo europeos en tres perfiles según su producción estadística por 90 minutos.
            </p>
          </div>
          ${archetypeShareHtml()}
        </div>

        <div class="clusters-3col-grid">
          ${cardsHtml}
        </div>
      `;
    }

    // ---------------------------------------------------------------------
    // Shell and events
    // ---------------------------------------------------------------------
    // Brings the open player's row into the table viewport when view 1 shows
    // it after a change made elsewhere: a review state, an archetype sample
    // link, the comparator's back button, or the comparator selector moving
    // the shared selection while the dossier stayed open. The row is marked
    // only while the dossier is open, so a closed dossier scrolls nothing.
    // Scrolls only the table container, never its overflow-hidden ancestors.
    function revealSelectedRow() {
      const container = document.getElementById("players-table-container");
      const row = container && container.querySelector ? container.querySelector(".player-row.selected") : null;
      if (!row) return;
      const top = row.offsetTop;
      const bottom = top + row.offsetHeight;
      const viewTop = container.scrollTop;
      const viewBottom = viewTop + container.clientHeight;
      if (top < viewTop || bottom > viewBottom) {
        container.scrollTop = Math.max(0, top - (container.clientHeight - row.offsetHeight) / 2);
      }
    }

    function renderStaticMeta() {
      const ready = dataStatus === "ready";
      const season = currentSeasonLabel();
      document.getElementById("topbar-meta").textContent = ready
        ? `Temporada ${season} · datos al ${formatDate(LATEST_AS_OF_DATE)}`
        : "";
      document.getElementById("sidebar-footer-text").textContent = ready
        ? `${formatNumber(TOTAL_PLAYERS)} jugadores · ${season}`
        : "";
    }

    function switchView(viewId) {
      state.activeView = viewId;
      document.querySelectorAll(".view-pane").forEach(el => {
        el.classList.toggle("active", el.id === viewId);
      });
      document.querySelectorAll(".sidebar .nav-btn").forEach(btn => {
        const isActive = btn.id === "nav-" + viewId;
        btn.classList.toggle("active", isActive);
        if (isActive) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });

      const titles = {
        "view-1": "Explorador de Mercado",
        "view-2": "Comparador Moneyball",
        "view-3": "Arquetipos Tácticos"
      };
      document.getElementById("active-view-title").textContent = titles[viewId] || titles["view-1"];
      renderAll();
      if (viewId === "view-1") revealSelectedRow();
    }

    function selectPlayer(playerId) {
      state.selectedPlayerId = Number(playerId);
      renderAll();
      const scrollBody = document.getElementById("dossier-scroll-body");
      if (scrollBody) scrollBody.scrollTop = 0;
    }

    // ---------------------------------------------------------------------
    // Dossier open and close (DESIGN.md §4, master-detail split)
    // ---------------------------------------------------------------------
    // One short status line instead of re-reading the whole dossier. While
    // view 1 is hidden (a comparator change closed the dossier behind it)
    // nothing is announced; the line is cleared so it never goes stale.
    function announceDossier() {
      const status = document.getElementById("dossier-status");
      if (!status) return;
      if (state.activeView !== "view-1") {
        status.textContent = "";
        return;
      }
      const player = PLAYERS_DATA.find(p => p.player_id === state.selectedPlayerId);
      status.textContent = state.dossierOpen && player ? `Ficha de ${player.name} abierta` : "Ficha cerrada";
    }

    function openDossier(playerId) {
      state.selectedPlayerId = Number(playerId);
      state.dossierOpen = true;
      renderAll();
      announceDossier();
    }

    // Focus goes back to the player's row button, or to the table when that
    // row is no longer rendered. Callers pass false when focus should stay
    // where it is: a toggle from the row button (renderPlayersTable already
    // refocuses it) or Escape pressed outside the dossier.
    function closeDossier(moveFocus = true) {
      if (!state.dossierOpen) return;
      state.dossierOpen = false;
      renderAll();
      announceDossier();
      if (moveFocus && !focusRowButton(state.selectedPlayerId)) {
        document.getElementById("players-table-container").focus({ preventScroll: true });
      }
    }

    // Activating the row of the player whose dossier is open closes it.
    function togglePlayerDossier(playerId) {
      const id = Number(playerId);
      if (state.dossierOpen && state.selectedPlayerId === id) closeDossier(false);
      else openDossier(id);
    }

    // The row click is a mouse shortcut; a click on the name button already
    // ran the toggle, so it is ignored here to avoid toggling twice.
    function handlePlayerRowClick(event, playerId) {
      if (event.target.closest(".row-open-btn")) return;
      togglePlayerDossier(playerId);
    }

    // Archetype sample links and the comparator's back button open a player's
    // dossier in view 1. Filters that would hide that row are cleared first,
    // because the dossier never shows a player the table does not list.
    function openPlayerInExplorer(playerId) {
      const id = Number(playerId);
      if (!getFilteredPlayers().some(p => p.player_id === id)) clearFilterState();
      state.selectedPlayerId = id;
      state.dossierOpen = true;
      switchView("view-1");
      announceDossier();
      focusRowButton(id);
    }

    // Escape closes the dossier from anywhere while view 1 is the active view
    // (sidebar and top bar included). A select keeps Escape for its own list,
    // and a search field with text clears first. Focus moves to the row
    // button only when it was inside the dossier (about to disappear) or on
    // the page body; anywhere else it stays put.
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape" || event.defaultPrevented) return;
      if (state.activeView !== "view-1" || !isDossierVisible()) return;
      const target = event.target;
      if (target.tagName === "SELECT") return;
      if (target.type === "search" && target.value !== "") return;
      const moveFocus = target === document.body || document.getElementById("dossier-panel").contains(target);
      event.preventDefault();
      closeDossier(moveFocus);
    });

    function handleSearchInput(val) {
      state.searchQuery = val;
      renderFilterSegments();
      renderPlayersTable();
      renderDossierPanel();
    }

    function setFilterPos(pos) {
      state.filterPos = pos;
      renderFilterSegments();
      renderPlayersTable();
      renderDossierPanel();
    }

    function setFilterVal(val) {
      state.filterVal = val;
      renderFilterSegments();
      renderPlayersTable();
      renderDossierPanel();
    }

    function setFilterCluster(cid) {
      state.filterCluster = cid;
      renderFilterSegments();
      renderPlayersTable();
      renderDossierPanel();
    }

    function clearFilterState() {
      state.searchQuery = "";
      state.filterPos = "ALL";
      state.filterVal = "ALL";
      state.filterCluster = "ALL";
      const searchInput = document.getElementById("player-search-input");
      if (searchInput) searchInput.value = "";
    }

    function resetAllFilters() {
      clearFilterState();
      renderAll();
    }

    // Shows the archetype as a list: the dossier stays closed, the list starts
    // at the top, and focus lands on its first player (the clicked link is in
    // the now hidden view 3).
    function filterByClusterFromView3(clusterId) {
      const wasOpen = state.dossierOpen;
      clearFilterState();
      state.filterCluster = String(clusterId);
      state.dossierOpen = false;
      switchView("view-1");
      if (wasOpen) announceDossier();
      const container = document.getElementById("players-table-container");
      container.scrollTop = 0;
      const firstButton = container.querySelector(".row-open-btn");
      (firstButton || container).focus({ preventScroll: true });
    }

    function renderAll() {
      renderStaticMeta();
      renderFilterSegments();
      renderExplorerFrame();
      renderPlayersTable();
      renderDossierPanel();
      renderMoneyballExpandedView();
      renderClustersView();
    }

    window.addEventListener("DOMContentLoaded", () => {
      applyRequestedScenario();
      renderAll();
      revealSelectedRow();
    });
  </script>
</body>
</html>
