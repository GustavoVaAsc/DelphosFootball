<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DelphosFootball · Dirección Deportiva</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2313233A' stroke-width='2'%3E%3Crect x='2' y='4' width='20' height='16' rx='2'/%3E%3Cline x1='12' y1='4' x2='12' y2='20'/%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Tokens: see DESIGN.md §2 (palette) and §3 (type scale). */
      --canvas: #F4F2EC;
      --surface: #FFFFFF;
      --surface-subtle: #FAF9F6;
      --surface-muted: #EEEBE3;

      --ink: #13233A;
      --ink-2: #4A5568;
      --ink-3: #5E6673;

      --rule: #E3DFD6;
      --control-border: #7F8690;
      --pitch-line: #8F8B81;
      --pitch-zone-fill: rgba(19, 35, 58, 0.16);
      --selected-bg: #EDEFF2;

      --up: #0B6E4F;
      --up-bg: #E6F1EC;
      --down: #B3261E;
      --down-bg: #F8E8E6;

      --sidebar-bg: #13233A;
      --sidebar-active: #22395A;
      --sidebar-text: #C9D1DC;
      --sidebar-muted: #9AA7B8;
      --sidebar-rule: rgba(255, 255, 255, 0.10);

      --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --stretch-condensed: 80%;

      --fs-11: 11px;
      --fs-12: 12px;
      --fs-13: 13px;
      --fs-15: 15px;
      --fs-20: 20px;
      --fs-28: 28px;

      --shadow-float: 0 1px 2px rgba(19, 35, 58, 0.12);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Desktop-only preview: the shell never shrinks below 1440px (DESIGN.md §4). */
    html, body {
      width: 100%;
      height: 100vh;
      overflow-x: auto;
      overflow-y: hidden;
      background-color: var(--canvas);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: var(--fs-13);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background-color: var(--selected-bg);
      color: var(--ink);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--rule);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--control-border);
    }

    a[href], button, select, input[type="search"] {
      cursor: pointer;
      font-family: inherit;
    }
    input[type="search"] {
      cursor: text;
    }
    button:disabled, select:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }
    .sidebar :focus-visible {
      outline-color: #FFFFFF;
    }

    button {
      transition: background-color 160ms var(--ease-out), border-color 160ms var(--ease-out), color 160ms var(--ease-out), transform 160ms var(--ease-out);
    }
    button:active:not(:disabled) {
      transform: scale(0.985);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Shell: 240px sidebar + main area */
    .app-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      width: 100%;
      min-width: 1440px;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      background-color: var(--sidebar-bg);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      height: 100vh;
      user-select: none;
      z-index: 20;
    }

    .brand-header {
      height: 60px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid var(--sidebar-rule);
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: var(--fs-15);
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.15;
    }

    .brand-subtitle {
      font-size: var(--fs-12);
      color: var(--sidebar-muted);
      font-weight: 500;
    }

    .nav-section {
      padding: 20px 12px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Weight is constant across states so labels never reflow. */
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: transparent;
      border: none;
      color: var(--sidebar-text);
      font-size: var(--fs-13);
      font-weight: 500;
      text-align: left;
      line-height: 1.3;
      white-space: nowrap;
    }
    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.06);
      color: #FFFFFF;
    }
    .nav-btn.active {
      background-color: var(--sidebar-active);
      color: #FFFFFF;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 18px;
      border-top: 1px solid var(--sidebar-rule);
      font-size: var(--fs-12);
      color: var(--sidebar-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .sidebar-footer:empty {
      visibility: hidden;
    }

    /* Main area */
    .main-area {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
      overflow: hidden;
      background-color: var(--canvas);
    }

    .topbar {
      height: 56px;
      padding: 0 24px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
      z-index: 10;
    }
    .page-h1 {
      font-size: var(--fs-20);
      font-weight: 700;
      color: var(--ink);
    }
    .topbar-meta {
      font-size: var(--fs-12);
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .workspace-container {
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
      position: relative;
    }

    @keyframes viewFadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dossierEnter {
      from { opacity: 0.65; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .view-pane {
      display: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .view-pane.active {
      display: flex;
      flex-direction: column;
      animation: viewFadeIn 180ms var(--ease-out) forwards;
    }

    /* ===================================================================== */
    /* VIEW 1: MARKET EXPLORER + DOSSIER                                     */
    /* ===================================================================== */

    /* One row that fits inside the 24px gutters at 1440 (DESIGN.md §4). */
    .single-line-filter-bar {
      padding: 10px 24px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: nowrap;
      min-width: 0;
    }

    .search-box {
      position: relative;
      width: 196px;
      flex-shrink: 0;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--ink-3);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 32px;
      padding: 0 8px 0 30px;
      background-color: var(--surface);
      border: 1px solid var(--control-border);
      border-radius: 7px;
      color: var(--ink);
      font-size: var(--fs-13);
      transition: border-color 160ms var(--ease-out);
    }
    .search-input::placeholder {
      color: var(--ink-3);
    }
    .search-input:hover {
      border-color: var(--ink-2);
    }

    .filter-field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .filter-label {
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .segment-group {
      display: inline-flex;
      align-items: center;
      background-color: var(--surface);
      padding: 2px;
      border-radius: 7px;
      border: 1px solid var(--control-border);
      gap: 2px;
      flex-shrink: 0;
    }
    .seg-btn {
      height: 26px;
      padding: 0 8px;
      border-radius: 5px;
      border: none;
      background: transparent;
      color: var(--ink-2);
      font-size: var(--fs-12);
      font-weight: 500;
      white-space: nowrap;
    }
    .seg-btn:hover {
      color: var(--ink);
      background-color: var(--surface-subtle);
    }
    .seg-btn.active,
    .seg-btn.active:hover {
      background-color: var(--ink);
      color: #FFFFFF;
    }

    .select-filter {
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--control-border);
      background-color: var(--surface);
      color: var(--ink);
      font-size: var(--fs-13);
      font-weight: 500;
    }
    .select-filter:hover {
      border-color: var(--ink-2);
    }

    .filter-bar-end {
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Master-detail body: the table alone at full width; the dossier opens
       on demand at a fixed 440px and the ledger keeps the rest (692px at 1440). */
    .master-detail-split {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px;
      padding: 18px 24px;
      overflow: hidden;
    }
    .master-detail-split.dossier-open {
      grid-template-columns: minmax(0, 1fr) 440px;
    }

    /* Market table */
    .table-card-container {
      background-color: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .table-scroll-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
    /* Focus lands here when the dossier closes and its row is gone; the card
       clips an outside ring, so it is drawn inside. */
    .table-scroll-container:focus-visible {
      outline-offset: -2px;
    }

    .players-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .players-table thead th {
      position: sticky;
      top: 0;
      z-index: 5;
      background-color: var(--surface-subtle);
      border-bottom: 1px solid var(--rule);
      padding: 10px 8px;
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--ink-3);
      text-align: left;
      white-space: nowrap;
    }
    /* Ledger cells: 10px vertical, 14px at the row edges, 16px between columns. */
    .players-table th:first-child,
    .players-table td:first-child {
      padding-left: 14px;
    }
    .players-table th:last-child,
    .players-table td:last-child {
      padding-right: 14px;
    }
    .players-table .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Fixed columns sized for their widest value; Jugador takes the rest. */
    .players-table col.col-age { width: 48px; }
    .players-table col.col-pos { width: 130px; }
    /* Dossier closed: the table has 1152px, so the sub-position gets one line
       ("Extremo izquierdo", the longest label, plus the glyph). */
    .master-detail-split:not(.dossier-open) .players-table col.col-pos { width: 180px; }
    .players-table col.col-market { width: 76px; }
    .players-table col.col-estimate { width: 100px; }
    .players-table col.col-gap { width: 120px; }

    .player-row {
      border-bottom: 1px solid var(--rule);
      background-color: var(--surface);
      transition: background-color 160ms var(--ease-out);
      cursor: pointer;
    }
    .skeleton-row {
      border-bottom: 1px solid var(--rule);
    }
    .player-row:last-child {
      border-bottom: none;
    }
    .player-row:hover {
      background-color: var(--surface-subtle);
    }
    .player-row.selected,
    .player-row.selected:hover {
      background-color: var(--selected-bg);
      box-shadow: inset 3px 0 0 var(--ink);
    }
    /* The row stays a table row; the name is the real control that opens the
       dossier. It looks like the name text and keeps the global focus ring. */
    .row-open-btn {
      display: inline;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      line-height: inherit;
      text-align: left;
      overflow-wrap: anywhere;
    }
    .row-open-btn:active:not(:disabled) {
      transform: none;
    }

    .players-table tbody td {
      padding: 10px 8px;
      vertical-align: middle;
    }

    .player-identity-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-wrap-44 {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .player-avatar-44 {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--surface-muted);
      border: 1px solid var(--rule);
      display: block;
    }
    /* The crest disc sits over the portrait: the one element that floats. */
    .club-crest-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: var(--surface);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow-float);
      object-fit: contain;
      padding: 2px;
    }
    .club-crest-badge.crest-17 {
      width: 17px;
      height: 17px;
    }
    .player-name-block {
      min-width: 0;
      flex: 1;
    }
    .player-name-text {
      font-weight: 700;
      font-size: var(--fs-15);
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .player-sub-line {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: var(--fs-12);
      color: var(--ink-2);
      line-height: 1.3;
      margin-top: 2px;
    }
    .player-arch-line {
      font-size: var(--fs-12);
      color: var(--ink-3);
      line-height: 1.3;
      margin-top: 1px;
    }
    .flag-img {
      width: 16px;
      height: 12px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
      border: 1px solid rgba(19, 35, 58, 0.12);
    }

    /* Position cell with the mini pitch glyph */
    .pos-zone-cell {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .mini-pitch-svg {
      width: 36px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 3px;
      background-color: var(--surface-subtle);
    }
    .pos-main {
      font-size: var(--fs-13);
      font-weight: 500;
      color: var(--ink);
      line-height: 1.25;
    }

    /* Pitch drawing shared by the row glyph and the archetype banners:
       neutral lines, zone in ink at low opacity, no zone hues. */
    .pitch-ground { fill: var(--surface); }
    .pitch-line { fill: none; stroke: var(--pitch-line); }
    .pitch-ground.pitch-line { fill: var(--surface); }
    .pitch-zone { fill: var(--pitch-zone-fill); stroke: var(--ink); }
    .pitch-player { fill: var(--ink); }

    /* Ledger value cells */
    .money {
      font-size: var(--fs-15);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
      white-space: nowrap;
    }
    .gap-cell {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }
    .gap-ratio {
      font-size: var(--fs-12);
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }

    /* Skeletons: static blocks, no shimmer (MOTION 1) */
    .sk {
      display: block;
      height: 10px;
      border-radius: 4px;
      background-color: var(--surface-muted);
    }
    .sk-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .sk-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
    .sk-glyph { width: 36px; height: 24px; border-radius: 3px; flex-shrink: 0; }
    .sk-pill { width: 84px; height: 20px; border-radius: 999px; }
    .sk-end { margin-left: auto; }
    .sk-w20 { width: 20px; }
    .sk-w50 { width: 50px; }
    .sk-w60 { width: 60px; }
    .sk-w70 { width: 70px; }
    .sk-w90 { width: 90px; }
    .sk-w120 { width: 120px; }

    /* State panels (loading, API unreachable) */
    .state-panel {
      margin: 48px auto;
      max-width: 480px;
      padding: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .view-scroll-pad > .state-panel {
      max-width: none;
      margin: 0;
      padding: 64px 28px;
      background-color: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
    }
    .state-title {
      font-size: var(--fs-15);
      font-weight: 700;
      color: var(--ink);
    }
    .state-text,
    .state-inline {
      font-size: var(--fs-13);
      color: var(--ink-2);
    }
    .explorer-state-panel {
      grid-column: 1 / -1;
      background-color: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .explorer-state-panel[hidden],
    .dossier-card-container[hidden],
    .master-detail-split.is-error > .table-card-container,
    .master-detail-split.is-error > .dossier-card-container {
      display: none;
    }

    /* Status pill: the only pill, reserved for the valuation verdict */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: var(--fs-12);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .status-undervalued {
      color: var(--up);
      background-color: var(--up-bg);
    }
    .status-fair {
      color: var(--ink);
      background-color: var(--surface-muted);
    }
    .status-overvalued {
      color: var(--down);
      background-color: var(--down-bg);
    }
    .elite-note {
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .table-footer-bar {
      height: 40px;
      padding: 0 14px;
      background-color: var(--surface-subtle);
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: center;
      font-size: var(--fs-12);
      color: var(--ink-2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ===================================================================== */
    /* DOSSIER                                                               */
    /* ===================================================================== */
    .dossier-animate {
      animation: dossierEnter 180ms var(--ease-out) forwards;
    }
    .dossier-card-container {
      background-color: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* Fixed header (flex-shrink: 0, never clipped by the scroll body) */
    .dossier-header {
      position: relative;
      flex-shrink: 0;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .dossier-player-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .dossier-identity-text {
      min-width: 0;
      flex: 1;
    }
    /* The header's one action: a 32x32 secondary icon button in its own
       top-right slot, so it takes width only from the name line (which
       reserves room for it), never from the club line. Two classes so the
       size wins over .btn-executive-secondary, declared later in the sheet. */
    .btn-executive-secondary.dossier-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      padding: 0;
      justify-content: center;
    }
    .dossier-close-btn svg {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
    }
    .dossier-name-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      padding-right: 32px;
    }
    .portrait-wrap-64 {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }
    .dossier-portrait-64 {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--surface-muted);
      border: 1px solid var(--rule);
      display: block;
    }
    .dossier-club-crest-24 {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: var(--surface);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow-float);
      object-fit: contain;
      padding: 2px;
    }
    .dossier-name-title {
      font-size: var(--fs-20);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
      line-height: 1.2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Country, club and league may wrap to a second line between items,
       never inside one. Each separator ends the item before it, so a line
       never starts with "·". */
    .dossier-club-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      column-gap: 6px;
      row-gap: 2px;
      margin-top: 4px;
      font-size: var(--fs-13);
      color: var(--ink-2);
    }
    .club-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .dossier-club-line strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* Bio: one definition row with hairline separators. It may wrap between
       items, never inside one. Every item carries its leading hairline and
       10px; the row is pulled 11px left and that strip is clipped, so the item
       that starts a line shows neither. */
    .dossier-bio-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      row-gap: 4px;
      margin-left: -11px;
      clip-path: inset(0 0 0 11px);
      font-size: var(--fs-12);
      font-variant-numeric: tabular-nums;
    }
    .bio-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      padding: 0 10px;
      border-left: 1px solid var(--rule);
      white-space: nowrap;
    }
    .bio-item dt {
      color: var(--ink-3);
    }
    .bio-item dd {
      color: var(--ink);
      font-weight: 500;
    }

    .dossier-scroll-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 20px 24px;
      display: flex;
      flex-direction: column;
    }

    /* Sections inside the dossier are separated by hairlines, not nested cards */
    .dossier-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid var(--rule);
    }
    .dossier-section:first-child {
      border-top: none;
    }
    .section-header-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .section-header-line.with-action {
      align-items: center;
    }
    .section-title {
      font-size: var(--fs-15);
      font-weight: 700;
      color: var(--ink);
    }
    .section-subtitle {
      font-size: var(--fs-12);
      color: var(--ink-3);
    }

    /* Valuation */
    /* Figures first, verdict on its own line below (the dossier is 440px). */
    .valuation-card-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .valuation-figures-pair {
      display: flex;
      align-items: baseline;
      gap: 28px;
    }
    .val-figure-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .val-figure-label {
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--ink-3);
    }
    .val-figure-number {
      font-size: var(--fs-28);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .valuation-verdict {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .verdict-gap {
      font-size: var(--fs-12);
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Dumbbell: axis from €0, market dot, estimate dot, gap segment by sign */
    .dumbbell {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 10px;
      align-items: center;
    }
    .dumbbell-zero {
      grid-column: 1;
      grid-row: 2;
      font-size: var(--fs-11);
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .dumbbell-labels {
      grid-column: 2;
      position: relative;
      height: 16px;
    }
    .dumbbell-labels.labels-top { grid-row: 1; }
    .dumbbell-labels.labels-bottom { grid-row: 3; }
    .dumbbell-track {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      height: 14px;
    }
    .dumbbell-axis {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background-color: var(--pitch-line);
    }
    .dumbbell-gap {
      position: absolute;
      top: 50%;
      height: 4px;
      margin-top: -2px;
      border-radius: 2px;
    }
    .dumbbell-gap.tone-up { background-color: var(--up); }
    .dumbbell-gap.tone-down { background-color: var(--down); }
    .dumbbell-gap.tone-neutral { background-color: var(--ink-3); }
    .dumbbell-dot {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
    }
    .dumbbell-dot.dot-market {
      background-color: var(--ink-2);
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--ink-2);
    }
    .dumbbell-dot.dot-estimate {
      background-color: var(--surface);
      border: 3px solid var(--ink);
    }
    .dumbbell-label {
      position: absolute;
      top: 0;
      font-size: var(--fs-11);
      color: var(--ink-2);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      transform: translateX(-50%);
    }
    .dumbbell-label.align-start { transform: translateX(-6px); }
    .dumbbell-label.align-end { transform: translateX(calc(-100% + 6px)); }
    .dumbbell-label strong {
      color: var(--ink);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
    }

    .model-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: var(--fs-12);
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .model-row strong,
    .model-row-label {
      color: var(--ink);
      font-weight: 600;
    }

    /* Season metrics: 4x2 grid without a nested box */
    .metrics-4x2-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px 12px;
    }
    .metric-clean-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-clean-label {
      font-size: var(--fs-11);
      font-weight: 500;
      color: var(--ink-3);
      line-height: 1.2;
      white-space: nowrap;
    }
    .metric-clean-number {
      font-size: var(--fs-15);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* Replacements: rows separated by hairlines */
    .replacements-list {
      display: flex;
      flex-direction: column;
    }
    .replacement-white-card {
      padding: 10px 0;
      border-top: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .replacement-white-card:first-child {
      border-top: none;
      padding-top: 0;
    }
    .rep-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .rep-name-line {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rep-name {
      font-weight: 700;
      font-size: var(--fs-15);
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
    }
    /* The club truncates so "· NN% de similitud" never wraps. */
    .rep-sub-line {
      display: flex;
      gap: 4px;
      min-width: 0;
      font-size: var(--fs-12);
      color: var(--ink-2);
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .rep-club {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rep-similarity {
      flex-shrink: 0;
    }
    .avatar-wrap-40 {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }
    .player-avatar-40 {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--surface-muted);
      border: 1px solid var(--rule);
    }
    .rep-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .rep-price {
      font-size: var(--fs-15);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
    }
    .rep-savings {
      font-size: var(--fs-12);
      color: var(--ink-2);
      white-space: nowrap;
    }
    /* Shortfall note: plain text above the rows, no box (DESIGN.md §5). */
    .coverage-note {
      font-size: var(--fs-12);
      color: var(--ink-2);
    }
    .coverage-note strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* Report prose */
    .scouting-report-box {
      font-family: var(--font-serif);
      font-size: var(--fs-15);
      line-height: 1.55;
      color: var(--ink-2);
      max-width: 68ch;
    }
    .scouting-report-box p + p {
      margin-top: 10px;
    }
    .scouting-report-box strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* Buttons */
    .btn-executive-primary {
      height: 32px;
      padding: 0 14px;
      border-radius: 7px;
      background-color: var(--ink);
      border: 1px solid var(--ink);
      color: #FFFFFF;
      font-size: var(--fs-12);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-executive-primary:hover {
      background-color: var(--sidebar-active);
    }
    .btn-executive-secondary {
      height: 30px;
      padding: 0 12px;
      border-radius: 7px;
      background-color: var(--surface);
      border: 1px solid var(--control-border);
      color: var(--ink);
      font-size: var(--fs-12);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-executive-secondary:hover:not(:disabled) {
      border-color: var(--ink-2);
      background-color: var(--surface-subtle);
    }

    /* ===================================================================== */
    /* VIEW 2: COMPARADOR MONEYBALL                                          */
    /* ===================================================================== */
    .view-scroll-pad {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .view-scroll-pad > * {
      flex-shrink: 0;
    }

    .toolbar-card {
      background-color: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .select-clean {
      height: 36px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid var(--control-border);
      background-color: var(--surface);
      color: var(--ink);
      font-size: var(--fs-13);
      font-weight: 500;
    }

    /* Comparison table: metrics as rows, players as columns */
    .compare-card {
      background-color: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .compare-table col.col-metric { width: 200px; }
    .compare-table th,
    .compare-table td {
      padding: 10px 14px;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--rule);
      font-size: var(--fs-13);
    }
    .compare-table thead th {
      vertical-align: top;
      padding-top: 14px;
      padding-bottom: 14px;
      font-weight: 400;
    }
    .compare-table tbody tr:last-child > * {
      border-bottom: none;
    }
    /* The reference column is set apart by its header, not by a colour stripe. */
    .cmp-ref-head {
      background-color: var(--surface-muted);
    }
    .cmp-ref {
      background-color: var(--surface-subtle);
    }
    .cmp-kicker {
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--ink-3);
      margin-bottom: 8px;
    }
    .cmp-ref-head .cmp-kicker {
      color: var(--ink);
      font-weight: 600;
    }
    .cmp-player {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cmp-player-text {
      min-width: 0;
    }
    .cmp-name {
      font-size: var(--fs-15);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
      line-height: 1.2;
    }
    .cmp-name .flag-img {
      display: inline-block;
      margin-left: 4px;
      vertical-align: 1px;
    }
    .cmp-sub {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      font-size: var(--fs-12);
      color: var(--ink-2);
      margin-top: 2px;
    }
    /* Club and league are two lines with no separator; the league never
       breaks inside itself. */
    .cmp-league {
      margin-top: 0;
      white-space: nowrap;
    }
    .cmp-metric {
      font-weight: 500;
      color: var(--ink-2);
    }
    .compare-table .cmp-group th {
      background-color: var(--surface-subtle);
      font-size: var(--fs-12);
      font-weight: 600;
      color: var(--ink-3);
      padding-top: 8px;
      padding-bottom: 8px;
    }
    .cmp-cell {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      column-gap: 8px;
    }
    .cmp-figure {
      font-size: var(--fs-15);
      font-weight: 700;
      font-stretch: var(--stretch-condensed);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .cmp-value {
      color: var(--ink);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .delta {
      font-size: var(--fs-12);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .delta-neutral,
    .cell-note {
      color: var(--ink-3);
    }
    .cell-note {
      font-size: var(--fs-12);
    }
    .cmp-slot-head,
    .cmp-slot {
      background-color: var(--surface-subtle);
    }
    .cmp-slot-text {
      font-size: var(--fs-13);
      color: var(--ink-2);
      line-height: 1.5;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ===================================================================== */
    /* VIEW 3: ARQUETIPOS TÁCTICOS                                           */
    /* ===================================================================== */
    .archetype-intro {
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 16px;
    }

    /* Share bar: segments and legend share flex-grow = player count */
    .share-figure {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .share-caption {
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--ink-3);
    }
    .share-bar,
    .share-legend {
      display: flex;
      gap: 2px;
    }
    .share-bar {
      height: 12px;
    }
    .share-seg {
      flex-basis: 0;
      min-width: 2px;
    }
    .share-seg:first-child { border-radius: 3px 0 0 3px; }
    .share-seg:last-child { border-radius: 0 3px 3px 0; }
    .share-legend-item {
      flex-basis: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .share-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--fs-13);
      font-weight: 600;
      color: var(--ink);
    }
    .share-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .share-count {
      padding-left: 14px;
      font-size: var(--fs-12);
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .share-tone-0 { background-color: var(--ink); }
    .share-tone-1 { background-color: var(--ink-2); }
    .share-tone-2 { background-color: var(--control-border); }

    /* Cards share row tracks (subgrid) so titles, pitches and lists align. */
    .clusters-3col-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(6, auto);
      column-gap: 20px;
      row-gap: 16px;
    }

    .cluster-card {
      grid-row: span 6;
      display: grid;
      grid-template-rows: subgrid;
      row-gap: 16px;
      background-color: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 20px;
    }
    @supports not (grid-template-rows: subgrid) {
      .cluster-head { min-height: 132px; }
    }
    .cluster-card-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .cluster-short-name {
      font-size: var(--fs-13);
      font-weight: 600;
      color: var(--ink-2);
    }
    .cluster-count {
      font-size: var(--fs-13);
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .cluster-title {
      font-size: var(--fs-20);
      font-weight: 700;
      color: var(--ink);
      line-height: 1.2;
    }
    .cluster-desc {
      font-size: var(--fs-13);
      color: var(--ink-2);
      margin-top: 4px;
      line-height: 1.5;
    }

    .cluster-pitch-banner {
      width: 100%;
      height: 112px;
      background-color: var(--surface-subtle);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .cluster-metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .cluster-samples-label {
      font-size: var(--fs-12);
      font-weight: 500;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .sample-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }
    .sample-list li + li {
      border-top: 1px solid var(--rule);
    }
    .sample-link {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      background: transparent;
      border: none;
      color: var(--ink);
      font-size: var(--fs-13);
      text-align: left;
    }
    .sample-name {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .sample-link:hover .sample-name span,
    .sample-link:focus-visible .sample-name span {
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .sample-price {
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .cluster-card-foot {
      align-self: end;
    }
    .text-link {
      background: none;
      border: none;
      padding: 0;
      color: var(--ink);
      font-size: var(--fs-13);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: var(--control-border);
      text-underline-offset: 3px;
    }
    .text-link:hover {
      text-decoration-color: var(--ink);
    }

    .view-intro-title {
      font-size: var(--fs-15);
      font-weight: 700;
      color: var(--ink);
    }
    .view-intro-text {
      font-size: var(--fs-13);
      color: var(--ink-2);
      margin-top: 2px;
    }

    .empty-state-card {
      margin: 32px auto;
      padding: 28px;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .empty-state-card p {
      color: var(--ink-2);
      font-size: var(--fs-13);
    }

    /* Valuation tone: last in the sheet so it wins over base text colours.
       Driven by valuation_status, never by the raw gap (DESIGN.md §2). */
    .tone-up { color: var(--up); }
    .tone-down { color: var(--down); }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR: brand + 3 modules + one-line footer -->
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="brand-header">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">

      "ES1": "LaLiga",
      "L1": "Bundesliga",
      "IT1": "Serie A",
      "FR1": "Ligue 1",
      "PO1": "Primeira Liga",
      "NL1": "Eredivisie",
      "TR1": "Süper Lig",
      "BE1": "Pro League",
      "DK1": "Superliga",
      "SC1": "Premiership",
      "GR1": "Super League",
      "UKR1": "Premier Liga",
      "RU1": "Premier Liga"
    };

    const CLUSTER_SHORT_LABELS = {
      0: "Creador Ofensivo",
      1: "Box-to-Box",
      2: "Ancla Defensiva"
    };

    const VALUATION_LABELS = {
      "undervalued": "Infravalorado",
      "fair": "En precio",
      "overvalued": "Sobrevalorado"
    };

    // Spanish text for every shortfall code the replacements stage can emit
    // (docs/ML_ARCHITECTURE.md §3, replacements). Codes never reach the UI raw.
    const SHORTFALL_MESSAGES = {
      "no_same_cluster_and_position_peer": () =>
        "Ningún otro jugador comparte arquetipo y posición.",
      "no_peer_within_athletic_distance": () =>
        "Ningún jugador del mismo arquetipo y posición está dentro de la distancia de similitud exigida.",
      "no_peer_below_cost_ceiling": () =>
        "Ningún jugador similar cuesta al menos un 20% menos.",
      "no_non_overvalued_peer": () =>
        "Los jugadores similares y más baratos están sobrevalorados.",
      "fewer_than_three_qualifying_peers": count =>
        `Solo ${formatCount(count, "jugador cumple", "jugadores cumplen")} todos los criterios: mismo arquetipo y posición, similitud suficiente, ahorro mínimo del 20% y no sobrevalorado.`
    };

    const MONTHS_ES_SHORT = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    const MINUS = "−";
    const NBSP = " ";

    // Dataset-level facts, derived from the data instead of hard-coded.
    const TOTAL_PLAYERS = CLUSTERS_DATA.clusters.reduce((sum, c) => sum + c.player_count, 0);
    const LATEST_AS_OF_DATE = PLAYERS_DATA
      .map(p => p.active_season && p.active_season.as_of_date)
      .filter(Boolean)
      .sort()
      .pop();

    // ---------------------------------------------------------------------
    // Review states (see the HTML comment above this script and DESIGN.md §7).
    // ---------------------------------------------------------------------
    const REVIEW_STATES = ["loading", "error", "no-season", "shortfall", "empty"];
    const requestedParam = new URLSearchParams(window.location.search).get("state");
    const requestedState = REVIEW_STATES.includes(requestedParam) ? requestedParam : null;

    // "ready" | "loading" | "error": what the (simulated) API request returned.
    let dataStatus = requestedState === "loading" || requestedState === "error" ? requestedState : "ready";

    // In the no-season review state, the first player is treated as having no
    // season row, which is how the API represents a player without minutes.
    const PLAYER_WITHOUT_SEASON_ID = requestedState === "no-season" ? PLAYERS_DATA[0].player_id : null;

    // selectedPlayerId drives the comparator and defaults to the first player;
    // dossierOpen decides whether view 1 shows that player's dossier.
    let state = {
      activeView: "view-1",
      selectedPlayerId: PLAYERS_DATA[0].player_id,
      dossierOpen: false,
      searchQuery: "",
      filterPos: "ALL",
      filterVal: "ALL",
      filterCluster: "ALL"
    };

    // The dossier depends only on the selected player and whether it is shown;
    // this key lets it skip re-rendering (and re-animating) on filters and
    // keystrokes. "closed" when hidden, so reopening always renders.
    let renderedDossierKey = null;

    // ---------------------------------------------------------------------
    // es-ES number formatting: one place for every number on screen.
    // Grouping is applied by hand because es-ES leaves four-digit numbers
    // ungrouped ("5522"), and the design wants "5.522".
    // ---------------------------------------------------------------------
    function isNumeric(value) {
      return value !== null && value !== undefined && Number.isFinite(Number(value));
    }

    function formatNumber(value, decimals = 0) {
      if (!isNumeric(value)) return "N/D";
      const n = Number(value);
      const fixed = Math.abs(n).toFixed(decimals);
      const [intPart, decPart] = fixed.split(".");
      const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      const sign = n < 0 && Number(fixed) !== 0 ? MINUS : "";
      return sign + (decPart ? `${grouped},${decPart}` : grouped);
    }

    function formatSignedNumber(value, decimals = 0) {
      const text = formatNumber(value, decimals);
      if (Number(Number(value).toFixed(decimals)) === 0) return "±0";
      return Number(value) > 0 ? "+" + text : text;
    }

    function formatEur(value) {
      if (!isNumeric(value)) return "N/D";
      const n = Number(value);
      const abs = Math.abs(n);
      let body;
      if (abs >= 999500) {
        body = formatNumber(abs / 1e6, 1) + NBSP + "M";
      } else if (abs >= 1e3) {
        body = formatNumber(abs / 1e3, 0) + NBSP + "mil";
      } else {
        body = formatNumber(abs, 0);
      }
      return (n < 0 ? MINUS : "") + "€" + body;
    }

    function formatSignedEur(value) {
      return (Number(value) > 0 ? "+" : "") + formatEur(value);
    }

    // Only exactly ±1 prints ±100%. A value that rounds to ±100% gets one
    // decimal ("−99,5%"); if it still rounds to 100 there (99,96, 100,03 or
    // float noise), it prints ±99,9% below 100 and ±100,1% above it.
    function formatPct(ratio, decimals = 0) {
      if (!isNumeric(ratio)) return "N/D";
      const pct = Number(ratio) * 100;
      const abs = Math.abs(pct);
      const roundsTo100 = d => Number(abs.toFixed(d)) === 100;
      if (abs === 100 || !roundsTo100(decimals)) return formatNumber(pct, decimals) + "%";
      const chosen = Math.max(decimals, 1);
      if (roundsTo100(chosen)) return formatNumber(Math.sign(pct) * (abs < 100 ? 99.9 : 100.1), 1) + "%";
      return formatNumber(pct, chosen) + "%";
    }

    // Shares (win, clean sheet, starter, probability) live in 0..1. Anything
    // outside is an upstream data error and is shown as N/D, never as "247%".
    function validShare(value) {
      if (!isNumeric(value)) return null;
      const n = Number(value);
      return n >= 0 && n <= 1 ? n : null;
    }

    function formatShare(value) {
      const share = validShare(value);
      return share === null ? "N/D" : formatPct(share);
    }

    // Whole percentage points as displayed in the comparator, or null.
    function sharePoints(value) {
      const share = validShare(value);
      return share === null ? null : Math.round(share * 100);
    }

    // Whole counts as displayed in the comparator, or null when missing.
    function roundOrNull(value) {
      return isNumeric(value) ? Math.round(Number(value)) : null;
    }

    function formatPoints(points) {
      return points === null ? "N/D" : `${formatNumber(points)}%`;
    }

    // Starts can never exceed matches played; otherwise starts are unknown.
    function validStarts(season) {
      const ok = isNumeric(season.starts) && isNumeric(season.apps)
        && Number(season.starts) >= 0 && Number(season.starts) <= Number(season.apps);
      return ok ? Number(season.starts) : null;
    }

    function formatSignedPct(ratio) {
      const text = formatPct(ratio);
      return Number(ratio) > 0 && text !== "0%" ? "+" + text : text;
    }

    // A positive ratio that would round to "0,0x" prints "<0,1x" instead.
    function formatMultiple(ratio) {
      if (!isNumeric(ratio)) return "N/D";
      const n = Number(ratio);
      if (n > 0 && n < 0.05) return "<" + formatNumber(0.1, 1) + "x";
      return formatNumber(n, 1) + "x";
    }

    function formatHeight(cm) {
      return isNumeric(cm) && Number(cm) > 0 ? formatNumber(Number(cm) / 100, 2) + NBSP + "m" : "N/D";
    }

    function formatMinutes(minutes) {
      return formatNumber(minutes) + "'";
    }

    function formatDate(isoDate) {
      if (!isoDate) return "N/D";
      const [year, month, day] = isoDate.split("-").map(Number);
      return `${day} ${MONTHS_ES_SHORT[month - 1]} ${year}`;
    }

    function formatSeason(season) {
      return `${season}/${String(Number(season) + 1).slice(-2)}`;
    }

    function formatCount(n, singular, plural) {
      return `${formatNumber(n)} ${Number(n) === 1 ? singular : plural}`;
    }

    // ---------------------------------------------------------------------
    // Data accessors
    // ---------------------------------------------------------------------
    function seasonOf(player) {
      if (player.player_id === PLAYER_WITHOUT_SEASON_ID) return null;
      return player.active_season || null;
    }

    function ageFromBirthDate(birthIso, refIso) {
      if (!birthIso || !refIso) return null;
      const [by, bm, bd] = birthIso.slice(0, 10).split("-").map(Number);
      const [ry, rm, rd] = refIso.slice(0, 10).split("-").map(Number);
      return ry - by - (rm < bm || (rm === bm && rd < bd) ? 1 : 0);
    }

    // Whole years: the season age when it exists, otherwise from the birth date
    // at the latest data date. Never rounded up (24.5 is 24).
    function playerAgeYears(player) {
      const s = seasonOf(player);
      if (s && isNumeric(s.age)) return Math.floor(Number(s.age));
      return ageFromBirthDate(player.date_of_birth, LATEST_AS_OF_DATE);
    }

    function currentSeasonLabel() {
      return formatSeason(CLUSTERS_DATA.season);
    }

    // The estimate takes the colour of the model's verdict, never of the raw
    // gap, so a player has exactly one verdict on screen (DESIGN.md §2).
    function statusToneClass(status) {
      if (status === "undervalued") return "tone-up";
      if (status === "overvalued") return "tone-down";
      return "";
    }

    function describeShortfall(payload) {
      const count = payload.qualifying_count;
      if (count >= 3) return null;
      const message = SHORTFALL_MESSAGES[payload.shortfall_reason];
      if (message) return message(count);
      return count === 0
        ? "Ningún jugador cumple los criterios de reemplazo."
        : `Solo ${formatCount(count, "jugador cumple", "jugadores cumplen")} los criterios de reemplazo.`;
    }

    // An unmapped country renders no flag: a wrong flag (the old "eu" fallback)
    // is worse than none.
    function getFlagImgHtml(countryName) {
      const iso = countryName ? COUNTRY_ISO_MAP[countryName] : null;
      if (!iso) return "";
      const esCountry = COUNTRY_ES_MAP[countryName] || countryName;
      return `<img class="flag-img" src="https://flagcdn.com/w40/${iso}.png" width="16" height="12" alt="Bandera de ${esCountry}" title="${esCountry}">`;
    }

    function getMiniPitchSvg(position, subPosition) {
      let zone = [13, 4, 10, 16];
      if (position === "Attack") {
        if (subPosition && subPosition.includes("Left")) zone = [23, 2, 11, 7];
        else if (subPosition && subPosition.includes("Right")) zone = [23, 15, 11, 7];
        else zone = [23, 6, 11, 12];
      } else if (position === "Defender") {
        if (subPosition && subPosition.includes("Right")) zone = [2, 15, 11, 7];
        else if (subPosition && subPosition.includes("Left")) zone = [2, 2, 11, 7];
        else zone = [2, 5, 10, 14];
      }
      const [x, y, w, h] = zone;
      return `
        <svg class="mini-pitch-svg" width="36" height="24" viewBox="0 0 36 24" aria-hidden="true">
          <rect class="pitch-line" x="1" y="1" width="34" height="22" rx="1.5" stroke-width="0.9"/>
          <line class="pitch-line" x1="18" y1="1" x2="18" y2="23" stroke-width="0.9"/>
          <circle class="pitch-line" cx="18" cy="12" r="3.2" stroke-width="0.9"/>
          <rect class="pitch-zone" x="${x}" y="${y}" width="${w}" height="${h}" rx="1.2" stroke-width="1.1"/>
        </svg>
      `;
    }

    // ---------------------------------------------------------------------
    // Shared state panels
    // ---------------------------------------------------------------------
    function statePanelHtml(kind) {
      if (kind === "loading") {
        return `
          <div class="state-panel" role="status" aria-live="polite">
            <p class="state-title">Cargando datos</p>
            <p class="state-text">Recuperando jugadores, valoraciones y reemplazos.</p>
          </div>
        `;
      }
      return `
        <div class="state-panel" role="alert">
          <p class="state-title">No se pudo conectar con el servidor de datos</p>
          <p class="state-text">Los datos del mercado no están disponibles ahora mismo. Comprueba la conexión e inténtalo de nuevo.</p>
          <button type="button" class="btn-executive-primary" onclick="retryLoad()">Reintentar</button>
        </div>
      `;
    }

    function retryLoad() {
      state.dossierOpen = false;
      dataStatus = "loading";
      renderAll();
      window.setTimeout(() => {
        dataStatus = "ready";
        renderAll();
        const title = document.getElementById("active-view-title");
        if (title && title.focus) title.focus();
      }, 700);
    }

    // ---------------------------------------------------------------------
    // Dossier pieces
    // ---------------------------------------------------------------------
    // valuation_status is the verdict. The classifiers are an independent check
    // that only answers "undervalued or not", so this line reports whether they
    // confirm the status, never a second verdict (DESIGN.md §2).
    function describeClassifierCheck(v) {
      const rf = v.rf_undervalued_pred;
      const dt = v.dt_undervalued_pred;
      // A missing prediction neither confirms nor denies the status.
      if (typeof rf !== "boolean" || typeof dt !== "boolean") return "Sin comprobación de los clasificadores.";
      if (rf !== dt) return "Random Forest y árbol de decisión no coinciden.";
      if (rf === (v.valuation_status === "undervalued")) return "Los dos clasificadores confirman el estado.";
      return `No confirman el estado: los dos clasificadores lo marcan como ${rf ? "infravalorado" : "no infravalorado"}.`;
    }

    function buildValuationDumbbellHtml(v) {
      const market = v.market_value_eur;
      const estimate = v.fair_value_eur;
      const scaleMax = Math.max(market, estimate) * 1.08;
      const toPct = val => Math.max(0, Math.min(100, (val / scaleMax) * 100));
      const marketPos = toPct(market);
      const estimatePos = toPct(estimate);
      const gapLeft = Math.min(marketPos, estimatePos);
      const gapWidth = Math.abs(estimatePos - marketPos);
      const gapTone = statusToneClass(v.valuation_status) || "tone-neutral";
      const alignFor = pos => (pos < 12 ? "align-start" : pos > 88 ? "align-end" : "");

      return `
        <div class="dumbbell" role="img" aria-label="Escala desde €0: precio de mercado ${formatEur(market)}, valor estimado ${formatEur(estimate)}">
          <div class="dumbbell-labels labels-top">
            <span class="dumbbell-label ${alignFor(estimatePos)}" style="left:${estimatePos.toFixed(1)}%">Valor estimado <strong>${formatEur(estimate)}</strong></span>
          </div>
          <span class="dumbbell-zero">€0</span>
          <div class="dumbbell-track">
            <div class="dumbbell-axis"></div>
            <div class="dumbbell-gap ${gapTone}" style="left:${gapLeft.toFixed(1)}%; width:${gapWidth.toFixed(1)}%"></div>
            <span class="dumbbell-dot dot-market" style="left:${marketPos.toFixed(1)}%"></span>
            <span class="dumbbell-dot dot-estimate" style="left:${estimatePos.toFixed(1)}%"></span>
          </div>
          <div class="dumbbell-labels labels-bottom">
            <span class="dumbbell-label ${alignFor(marketPos)}" style="left:${marketPos.toFixed(1)}%">Mercado <strong>${formatEur(market)}</strong></span>
          </div>
        </div>
      `;
    }

    function buildExecutiveNarrativeHtml(player) {
      const s = seasonOf(player);
      const v = player.valuation;
      const rep = player.replacements_payload;
      const diffEur = v.fair_value_eur - v.market_value_eur;
      const diffRatio = diffEur / v.market_value_eur;
      const subPosEs = SUBPOS_LABELS[player.sub_position] || POS_LABELS[player.position] || player.position;
      const direction = diffEur >= 0 ? "por encima" : "por debajo";

      const p1 = `<p><strong>Valoración.</strong> ${player.name} tiene un precio de mercado de <strong>${formatEur(v.market_value_eur)}</strong> y un valor estimado de <strong>${formatEur(v.fair_value_eur)}</strong>, un ${formatPct(Math.abs(diffRatio))} ${direction} del precio. Estado: <strong>${VALUATION_LABELS[v.valuation_status]}</strong>.</p>`;

      let p2;
      if (s) {
        const leagueName = LEAGUE_NAMES[s.league_id] || s.league_id;
        // Out-of-range starts or win share are left out rather than printed.
        const starts = validStarts(s);
        const appsText = formatCount(s.apps, "partido", "partidos")
          + (starts === null ? "" : ` (${formatNumber(starts)} como titular)`);
        const goalsText = `<strong>${formatCount(s.goals, "gol", "goles")}</strong>`;
        const assistsText = `<strong>${formatCount(s.assists, "asistencia", "asistencias")}</strong>`;
        const outputText = validShare(s.win_rate) === null
          ? `${goalsText} y ${assistsText}`
          : `${goalsText}, ${assistsText} y un <strong>${formatShare(s.win_rate)} de victorias</strong>`;
        p2 = `<p><strong>Temporada ${formatSeason(s.season)} (${leagueName}).</strong> Como ${subPosEs.toLowerCase()} en ${player.club_name}, suma <strong>${formatNumber(s.minutes)} minutos</strong> en <strong>${appsText}</strong>, con ${outputText}.</p>`;
      } else {
        p2 = `<p><strong>Temporada ${currentSeasonLabel()}.</strong> Sin estadísticas de temporada para este jugador.</p>`;
      }

      let p3;
      if (rep.replacements.length > 0) {
        const repNames = rep.replacements.map(c =>
          `<strong>${c.candidate_name}</strong> (${c.candidate_club_name}, ahorro de ${formatEur(c.cost_savings_eur)}, ${formatPct(c.cost_ratio - 1)})`
        ).join(", ");
        p3 = `<p><strong>Reemplazos.</strong> En el arquetipo ${CLUSTER_SHORT_LABELS[player.cluster_id]}, los candidatos más similares con al menos un 20% de ahorro son: ${repNames}.</p>`;
      } else {
        p3 = `<p><strong>Reemplazos.</strong> ${describeShortfall(rep) || "Ningún jugador cumple los criterios de reemplazo."}</p>`;
      }

      return p1 + p2 + p3;
    }

    // ---------------------------------------------------------------------
    // Filters
    // ---------------------------------------------------------------------
    function getFilteredPlayers() {
      return PLAYERS_DATA.filter(p => {
        if (state.filterPos !== "ALL" && p.position !== state.filterPos) return false;
        if (state.filterVal !== "ALL" && p.valuation.valuation_status !== state.filterVal) return false;
        if (state.filterCluster !== "ALL" && p.cluster_id !== Number(state.filterCluster)) return false;
        if (state.searchQuery.trim() !== "") {
          const q = state.searchQuery.toLowerCase();
          const matchName = p.name.toLowerCase().includes(q);
          const matchClub = (p.club_name || "").toLowerCase().includes(q);
          const subEs = (SUBPOS_LABELS[p.sub_position] || "").toLowerCase();
          if (!matchName && !matchClub && !subEs.includes(q)) return false;
        }
        return true;
      });
    }

    function hasActiveFilters() {
      return state.searchQuery.trim() !== ""
        || state.filterPos !== "ALL"
        || state.filterVal !== "ALL"
        || state.filterCluster !== "ALL";
    }

    function describeActiveFilters() {
      const parts = [];
      if (state.searchQuery.trim() !== "") parts.push(`búsqueda «${state.searchQuery.trim()}»`);
      if (state.filterVal !== "ALL") parts.push(`estado ${VALUATION_LABELS[state.filterVal]}`);
      if (state.filterPos !== "ALL") parts.push(`posición ${POS_LABELS[state.filterPos]}`);
      if (state.filterCluster !== "ALL") parts.push(`arquetipo ${CLUSTER_SHORT_LABELS[state.filterCluster]}`);
      return parts.join(" · ");
    }

    // The empty review state presets the first status/archetype pair (then
    // position/archetype) that the real rows do not cover.
    function findEmptyFilterCombination() {
      const clusterIds = CLUSTERS_DATA.clusters.map(c => c.cluster_id);
      for (const val of Object.keys(VALUATION_LABELS)) {
        for (const cluster of clusterIds) {
          const n = PLAYERS_DATA.filter(p => p.valuation.valuation_status === val && p.cluster_id === cluster).length;
          if (n === 0) return { filterVal: val, filterCluster: String(cluster) };
        }
      }
      for (const pos of Object.keys(POS_LABELS)) {
        for (const cluster of clusterIds) {
          const n = PLAYERS_DATA.filter(p => p.position === pos && p.cluster_id === cluster).length;
          if (n === 0) return { filterPos: pos, filterCluster: String(cluster) };
        }
      }
      return null;
    }

    // shortfall and no-season open the dossier they exist to show; every other
    // state starts with the dossier closed.
    function applyRequestedScenario() {
      if (requestedState === "shortfall") {
        const target = PLAYERS_DATA.find(p => p.replacements_payload.qualifying_count < 3);
        if (target) {
          state.selectedPlayerId = target.player_id;
          state.dossierOpen = true;
        }
      } else if (requestedState === "no-season") {
        state.selectedPlayerId = PLAYER_WITHOUT_SEASON_ID;
        state.dossierOpen = true;
      } else if (requestedState === "empty") {
        Object.assign(state, findEmptyFilterCombination() || {});
      }
    }

    function renderFilterSegments() {
      const busy = dataStatus !== "ready";
      document.querySelectorAll("[data-filter-val]").forEach(btn => {
        const isActive = btn.getAttribute("data-filter-val") === state.filterVal;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
        btn.disabled = busy;
      });
      const searchInput = document.getElementById("player-search-input");
      if (searchInput) searchInput.disabled = busy;
      const posSelect = document.getElementById("filter-pos-select");
      if (posSelect) {
        posSelect.value = state.filterPos;
        posSelect.disabled = busy;
      }
      const clusterSelect = document.getElementById("filter-cluster-select");
      if (clusterSelect) {
        clusterSelect.value = String(state.filterCluster);
        clusterSelect.disabled = busy;
      }
      const resetBtn = document.getElementById("reset-filters-btn");
      if (resetBtn) resetBtn.disabled = busy || !hasActiveFilters();
    }

    // ---------------------------------------------------------------------
    // View 1: ledger table
    // ---------------------------------------------------------------------
    function tableShellHtml() {
      return `
        <table class="players-table" aria-label="Jugadores">
          <colgroup>
            <col>
            <col class="col-age">
            <col class="col-pos">
            <col class="col-market">
            <col class="col-estimate">
            <col class="col-gap">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">Jugador</th>
              <th scope="col" class="num">Edad</th>
              <th scope="col">Posición</th>
              <th scope="col" class="num">Mercado</th>
              <th scope="col" class="num">Valor estimado</th>
              <th scope="col" class="num">Brecha</th>
            </tr>
          </thead>
          <tbody id="players-tbody"></tbody>
        </table>
      `;
    }

    function skeletonRowsHtml(count) {
      const row = `
        <tr class="skeleton-row" aria-hidden="true">
          <td>
            <div class="player-identity-cell">
              <span class="sk sk-avatar"></span>
              <div class="sk-stack"><span class="sk sk-w120"></span><span class="sk sk-w90"></span><span class="sk sk-w70"></span></div>
            </div>
          </td>
          <td class="num"><span class="sk sk-w20 sk-end"></span></td>
          <td><div class="pos-zone-cell"><span class="sk sk-glyph"></span><span class="sk sk-w60"></span></div></td>
          <td class="num"><span class="sk sk-w50 sk-end"></span></td>
