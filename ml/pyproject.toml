[project]
name = "delphos-ml"
version = "0.1.0"
description = "DelphosFootball shared ML package and offline pipeline CLI."
license = "BSD-3-Clause"
requires-python = ">=3.13,<3.14"
dependencies = [
    "kagglehub>=1.0.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "typer>=0.27.3",
]

[project.scripts]
delphos-pipeline = "delphos_ml.pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# Python only: ruff 0.17 also formats Markdown by default, and the docs are hand-written.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
